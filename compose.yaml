services:
  api:
    build: .
    environment:
      PORT: 8000
      RUNTIME_DIR: /data/.runtime
    ports:
      - "8000:8000"
    volumes:
      - planner-data:/data/.runtime
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  planner-data:
